services:
  # ========================================================
  # 1. PostgreSQL 16 Relational Database Service
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: hirose-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hirose_maintenance}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hirose_maintenance}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - hirose-network

  # ========================================================
  # 2. Hono Node.js REST API Backend Service
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirose-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-hirose_maintenance}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey_hirose_maintenance_log_2026}
    ports:
      - "${BACKEND_PORT:-4000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hirose-network

  # ========================================================
  # 3. Vue 3 SPA + Nginx Web Server Frontend Service
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=
    container_name: hirose-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - hirose-network

# ========================================================
# Networks & Persistent Volumes
# ========================================================
networks:
  hirose-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
